# Automates engineering calculation validation checks whenever your repository receives changes.


name: Engineering Calculation Validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Engineering Toolsets
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Unit Asserts
      run: |
        pytest
    - name: Run Master Simulation Suite
      run: |
        python main.py
        
